name: CI

on:
  pull_request:
  push:
    branches: [main]

# Start from no permissions and grant only what a job needs.
permissions:
  contents: read

# A new push to a PR cancels the in-flight run for that PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# NOTE: third-party actions should be pinned to a commit SHA rather than a tag
# before this repo handles anything sensitive. Actions published by GitHub
# itself (actions/*) are lower risk pinned to a major version.

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Replace these with your real toolchain. The job name `build` is what
      # the branch ruleset requires as a status check — if you rename the job,
      # update .github/rulesets/main.json to match, or pull requests will block
      # forever waiting on a check that never reports.
      - name: Lint
        run: echo "TODO: lint"

      - name: Test
        run: echo "TODO: test"

      - name: Build
        run: echo "TODO: build"
